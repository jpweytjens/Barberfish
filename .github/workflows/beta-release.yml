name: Beta Release

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency:
  group: "beta-release"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.detect_version.outputs.VERSION }}
      NOTES: ${{ steps.release_notes.outputs.NOTES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect beta version
        id: detect_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_version=$(grep 'versionName' app/build.gradle.kts | sed -e 's/.*"\(.*\)".*/\1/' | head -n 1)
          echo "Current version: $current_version"

          if [[ "$current_version" != *-beta* ]]; then
            echo "Not a beta version; nothing to do."
            exit 0
          fi

          if gh release view "$current_version" --repo jpweytjens/Betafish > /dev/null 2>&1; then
            echo "Version $current_version already released on Betafish. No new release will be created."
            exit 0
          fi

          current_code=$(grep 'versionCode' app/build.gradle.kts | sed -e 's/[^0-9]*//g' | head -n 1)
          latest_code=$(curl -fsSL https://github.com/jpweytjens/Betafish/releases/latest/download/manifest.json | jq -r '.latestVersionCode' || echo 0)
          echo "versionCode: $current_code (latest published: $latest_code)"
          if [[ "$current_code" -le "$latest_code" ]]; then
            echo "::error::versionCode $current_code does not exceed the latest published beta's $latest_code. Bump versionCode along with versionName."
            exit 1
          fi

          echo "VERSION=$current_version" >> $GITHUB_OUTPUT

      - name: Extract release notes from the Betafish changelog
        id: release_notes
        if: steps.detect_version.outputs.VERSION
        run: |
          VERSION="${{ steps.detect_version.outputs.VERSION }}"
          curl -fsSL https://raw.githubusercontent.com/jpweytjens/Betafish/master/CHANGELOG.md > betafish-changelog.md
          notes=$(awk "/^## $VERSION/{found=1; next} found && /^## /{exit} found{print}" betafish-changelog.md | sed -e '/./,$!d')

          if [[ -z "$(echo "$notes" | tr -d '[:space:]')" ]]; then
            echo "::error::No \"## $VERSION\" section in Betafish's CHANGELOG.md. Push the changelog entry to Betafish first, then re-run."
            exit 1
          fi
          if [[ "$notes" == *"]("* ]]; then
            echo "::error::The $VERSION changelog section contains a markdown link. The Karoo renders release notes as plain text; keep links out of version sections."
            exit 1
          fi

          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.VERSION
    env:
      MANIFEST_URL: https://github.com/jpweytjens/Betafish/releases/latest/download/manifest.json
      BASE_URL: https://github.com/jpweytjens/Betafish/releases/latest/download
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon test

      - name: Inject signing config
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > app/barberfish.keystore
          echo "signing.store.file=barberfish.keystore" >> local.properties
          echo "signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }}" >> local.properties
          echo "signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }}" >> local.properties
          echo "signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}" >> local.properties

      - name: Assemble release APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Generate manifest
        env:
          RELEASE_NOTES: ${{ needs.check.outputs.NOTES }}
        run: ./gradlew --no-daemon generateManifest

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/barberfish.apk

      - name: Create Betafish release
        uses: softprops/action-gh-release@v2
        with:
          repository: jpweytjens/Betafish
          token: ${{ secrets.BETAFISH_TOKEN }}
          tag_name: ${{ needs.check.outputs.VERSION }}
          name: ${{ needs.check.outputs.VERSION }}
          body: ${{ needs.check.outputs.NOTES }}
          files: |
            app/build/outputs/apk/release/barberfish.apk
            app/src/main/res/drawable/ic_extension.png
            app/manifest.json
