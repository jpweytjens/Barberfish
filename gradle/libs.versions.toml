[versions]
compileSdk = "36"
minSdk = "23"
targetSdk = "34"
kotlin = "2.0.20"

[plugins]
android-application = { id = "com.android.application", version = "8.7.3" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
hammerhead-karoo-ext = { module = "io.hammerhead:karoo-ext", version = "1.1.9" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.16.0" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.1.7" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version = "1.3.2" }
timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
